<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" width="360" height="388" role="img" aria-labelledby="t-esp32 d-esp32" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><title id="t-esp32">ESP32 devkit: bench wiring</title><desc id="d-esp32">ESP32 devkit wiring for the DMA bench: SPI3 (VSPI) with MOSI GPIO23 jumpered to MISO GPIO19, SCLK GPIO18, CS GPIO5, USB console.</desc><rect width="360" height="388" rx="14" fill="#0E131A" stroke="#283241"/><text x="16" y="34" font-size="11" font-weight="700" fill="#F8D27A" text-anchor="start">BENCH WIRING</text><text x="16" y="56" font-size="18" font-weight="700" fill="#E8EDF3" text-anchor="start">ESP32 devkit</text><text x="16" y="76" font-size="12" font-weight="400" fill="#9AA6B5" text-anchor="start">SPI items, T8 receive rounding</text><rect x="16" y="96" width="132" height="244" rx="10" fill="#151C26" stroke="#3A4657" stroke-width="1.5"/><text x="82" y="118" font-size="12" font-weight="600" fill="#9AA6B5" text-anchor="middle">SPI3 (VSPI)</text><rect x="26" y="134" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="149.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">SCLK</text><text x="132" y="149.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO18</text><line x1="148" y1="145.0" x2="182" y2="145.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="145.0" r="3" fill="#60A5FA"/><text x="188" y="149.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">analyser CH0, optional</text><rect x="26" y="164" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="179.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">MOSI</text><text x="132" y="179.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO23</text><line x1="148" y1="175.0" x2="182" y2="175.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="175.0" r="3" fill="#60A5FA"/><text x="188" y="179.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">jumper to MISO</text><rect x="26" y="194" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="209.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">MISO</text><text x="132" y="209.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO19</text><line x1="148" y1="205.0" x2="182" y2="205.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="205.0" r="3" fill="#60A5FA"/><text x="188" y="209.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">jumper from MOSI</text><rect x="26" y="224" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="239.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">CS</text><text x="132" y="239.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO5</text><line x1="148" y1="235.0" x2="182" y2="235.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="235.0" r="3" fill="#60A5FA"/><text x="188" y="239.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">analyser CH1, optional</text><rect x="26" y="254" width="112" height="22" rx="6" fill="#2C2310" stroke="#6A5220"/><text x="34" y="269.5" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="start">3V3</text><text x="132" y="269.5" font-size="12" font-weight="400" fill="#FDE68A" text-anchor="end"></text><line x1="148" y1="265.0" x2="182" y2="265.0" stroke="#FBBF24" stroke-width="2"/><circle cx="148" cy="265.0" r="3" fill="#FBBF24"/><text x="188" y="269.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">divider top</text><rect x="26" y="284" width="112" height="22" rx="6" fill="#1B232E" stroke="#3A4656"/><text x="34" y="299.5" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="start">GND</text><text x="132" y="299.5" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="end"></text><line x1="148" y1=