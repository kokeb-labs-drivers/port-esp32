---
kind: matrix
id: port-contracts
title: Contracts on the ESP32 port
kicker: port-esp32
subtitle: Which kb-core contracts each peripheral implements, over which ESP-IDF v5.5 driver.
alt: >-
  Matrix of the kb-core contracts the ESP32 port implements for I2C, SPI, UART, CAN, ADC, PWM, GPIO, clock and log,
  each marked native, adapted, planned or not available.
reads: >-
  Rows are the peripherals I2C, SPI, UART, CAN, ADC, PWM, GPIO, Clock and delay, Log and Pulse output; the columns
  are the base contract of the peripheral and its extra contracts. Native means the contract maps onto the ESP-IDF
  driver named in the cell; adapted means the port adds its own logic to meet the contract, such as telling a NACK
  from a timeout by the elapsed time or adding the SPI device again for a new clock. Planned marks a contract kb-core
  has not defined yet, and n/a one that the chip or kb-core does not have.
profile: phone
print: portrait
sources:
  - inc/kb/port/esp32/port.hpp
  - inc/kb/port/esp32/i2c.hpp
  - inc/kb/port/esp32/spi.hpp
  - inc/kb/port/esp32/uart.hpp
  - inc/kb/port/esp32/can.hpp
  - inc/kb/port/esp32/gpio.hpp
  - inc/kb/port/esp32/time.hpp
  - inc/kb/port/esp32/log.hpp
  - src/i2c.cpp
  - src/spi.cpp
cell_width: 200
statuses: {ok: native, warn: adapted, planned: planned, na: n/a}
rows:
  - {id: i2c, label: I2C}
  - {id: spi, label: SPI}
  - {id: uart, label: UART}
  - {id: can, label: CAN}
  - {id: adc, label: ADC}
  - {id: pwm, label: PWM}
  - {id: gpio, label: GPIO}
  - {id: time, label: Clock and delay}
  - {id: log, label: Log}
  - {id: pulse, label: Pulse output}
cols:
  - {id: base, label: Base contract}
  - {id: extra, label: Extra contracts}
cells:
  - {row: i2c, col: base, status: warn, text: adapted, note: "I2cBus, i2c_master"}
  - {row: i2c, col: extra, status: planned, text: planned, note: I2cTransactional}
  - {row: spi, col: base, status: ok, text: native, note: "SpiDevice, spi_master"}
  - {row: spi, col: extra, status: warn, text: adapted, note: SpiClockControl}
  - {row: uart, col: base, status: ok, text: native, note: "UartPort, uart"}
  - {row: uart, col: extra, status: ok, text: native, note: "BaudControl, TxDrain"}
  - {row: can, col: base, status: ok, text: native, note: "CanBus, TWAI"}
  - {row: can, col: extra, status: na, text: n/a, note: no CAN FD on chip}
  - {row: adc, col: base, status: ok, text: native, note: "AdcChannel, adc_oneshot"}
  - {row: adc, col: extra, status: na, text: n/a, note: none defined}
  - {row: pwm, col: base, status: ok, text: native, note: "PwmOutput, LEDC"}
  - {row: pwm, col: extra, status: na, text: n/a, note: none defined}
  - {row: gpio, col: base, status: ok, text: native, note: "GpioOutput, GpioInput"}
  - {row: gpio, col: extra, status: ok, text: native, note: GpioInterrupt}
  - {row: time, col: base, status: ok, text: native, note: "MonotonicClock, esp_timer"}
  - {row: time, col: extra, status: ok, text: native, note: "BusyWait, ROM delay"}
  - {row: log, col: base, status: ok, text: native, note: "LogSink, esp_log"}
  - {row: log, col: extra, status: na, text: n/a, note: none defined}
  - {row: pulse, col: base, status: planned, text: planned, note: "PulseTx (RMT)"}
  - {row: pulse, col: extra, status: na, text: n/a, note: none defined}
