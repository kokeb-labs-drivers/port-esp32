  - {from: ctl, to: ctl, label: writer lock}
  - {from: ctl, to: idf, label: uart_tx_chars}
  - {from: idf, to: dev, label: TX bytes}
  - {note: "FIFO full: refill after 8 characters", over: [ctl, idf]}
