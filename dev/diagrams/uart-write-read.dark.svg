<svg xmlns="http://www.w3.org/2000/svg" width="565" height="904" viewBox="0 0 565 904" role="img" aria-labelledby="uart-write-read-title uart-write-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-write-read-title">A UART request and reply</title>
<desc id="uart-write-read-desc">Sequence of a UART Write followed by a Read on the ESP32 port, in which the port fills the transmit FIFO itself, the reply lands in ESP-IDF's receive ring buffer, and Read waits only for its first byte.</desc>
<defs><marker id="uart-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="564" height="903" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">A UART request and reply</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Write fills the hardware FIFO; Read takes the first byte with a</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">timeout, then what is already buffered.</text>
<rect x="32" y="140.4" width="501" height="1" fill="#252F3C"/>
<path d="M104.7 214.4 L104.7 888.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M290.3 214.4 L290.3 888.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M460.3 214.4 L460.3 888.5" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.7 294.4 L130.7 294.4 Q138.7 294.4 138.7 302.4 L138.7 302.4 Q138.7 310.4 130.7 310.4 L108.7 310.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.7 346.4 L286.3 346.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M294.3 390.4 L456.3 390.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M456.3 486.4 L294.3 486.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.7 574.5 L130.7 574.5 Q138.7 574.5 138.7 582.5 L138.7 582.5 Q138.7 590.5 130.7 590.5 L108.7 590.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.7 626.5 L286.3 626.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.7 670.5 L286.3 670.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M286.3 714.5 L108.7 714.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M108.7 758.5 L286.3 758.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uart-write-read-arrow-rail)"/>
<path d="M286.3 802.5 L108.7 802.5" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#uart-write-read-arrow-rail)"/>
<rect x="39.7" y="158.4" width="130" height="52" rx="10" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="39.7" y="166.4" width="4" height="36" rx="2" fill="#FBBF24"/>
<rect x="223.1" y="158.4" width="134.3" height="52" rx="10" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="223.1" y="166.4" width="4" height="36" rx="2" fill="#94A3B8"/>
<rect x="395.3" y="158.4" width="130" height="52" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<rect x="395.3" y="166.4" width="4" height="36" rx="2" fill="#4ADE80"/>
<rect x="34.7" y="234.4" width="325.5" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<rect x="34.7" y="418.4" width="325.5" height="43" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<rect x="34.7" y="514.5" width="325.5" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<rect x="34.7" y="830.5" width="325.5" height="43" rx="10" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="107.7" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FDE68A">Uart</text>
<text x="293.3" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#E2E8F0">uart driver</text>
<text x="463.3" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#BBF7D0">Device</text>
<text x="48.7" y="261.2" font-size="15" fill="#BFDBFE">the driver calls Write(tx)</text>
<rect x="142.7" y="291.4" width="86.8" height="22" rx="11" fill="#0E131A"/>
<text x="186.1" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">writer lock</text>
<rect x="144.1" y="321.4" width="106.9" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">uart_tx_chars</text>
<rect x="337.5" y="365.4" width="75.5" height="22" rx="11" fill="#0E131A"/>
<text x="375.3" y="381.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">TX bytes</text>
<text x="48.7" y="445.2" font-size="15" fill="#FDE68A">FIFO full: refill after 8 characters</text>
<rect x="339.3" y="461.4" width="71.9" height="22" rx="11" fill="#0E131A"/>
<text x="375.3" y="477.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">RX reply</text>
<text x="48.7" y="541.2" font-size="15" fill="#BFDBFE">the driver calls Read(rx, timeout)</text>
<rect x="142.7" y="571.5" width="92" height="22" rx="11" fill="#0E131A"/>
<text x="188.7" y="587.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">reader lock</text>
<rect x="117.2" y="601.5" width="160.6" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="617.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">pending error events</text>
<rect x="121.7" y="645.5" width="151.7" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="661.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">read 1 byte, timeout</text>
<rect x="159.7" y="689.5" width="75.6" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="705.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">first byte</text>
<rect x="112.7" y="733.5" width="169.5" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="749.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">read buffered, no wait</text>
<rect x="164.4" y="777.5" width="66.1" height="22" rx="11" fill="#0E131A"/>
<text x="197.5" y="793.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">the rest</text>
<text x="48.7" y="857.2" font-size="15" fill="#BFDBFE">byte count back to the driver</text>
</svg>
