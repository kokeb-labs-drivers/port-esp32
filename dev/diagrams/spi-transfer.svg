<svg xmlns="http://www.w3.org/2000/svg" width="552" height="816" viewBox="0 0 552 816" role="img" aria-labelledby="spi-transfer-title spi-transfer-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-transfer-title">One SPI frame</title>
<desc id="spi-transfer-desc">Sequence of an SPI Transfer on the ESP32 port, in which the device takes the bus lock, ESP-IDF clocks the whole frame as one polling transaction with chip select low, and the port waits for its end with a bound sized to the frame.</desc>
<defs><marker id="spi-transfer-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="551" height="815" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">One SPI frame</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Transfer through SpiDevice and ESP-IDF's spi_master in polling</text>
<text x="32" y="124.5" font-size="15" fill="#566070">mode, chip select held for the frame.</text>
<rect x="32" y="140.4" width="488" height="1" fill="#E2E7EE"/>
<path d="M105.2 214.4 L105.2 800.5" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M275.2 214.4 L275.2 800.5" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M447.2 214.4 L447.2 800.5" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M109.2 294.4 L131.2 294.4 Q139.2 294.4 139.2 302.4 L139.2 302.4 Q139.2 310.4 131.2 310.4 L109.2 310.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M109.2 398.4 L271.2 398.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M279.2 442.4 L443.2 442.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M443.2 486.4 L279.2 486.4" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M279.2 530.5 L443.2 530.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M109.2 574.5 L271.2 574.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M271.2 618.5 L109.2 618.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#spi-transfer-arrow-rail)"/>
<path d="M109.2 706.5 L131.2 706.5 Q139.2 706.5 139.2 714.5 L139.2 714.5 Q139.2 722.5 131.2 722.5 L109.2 722.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-transfer-arrow-rail)"/>
<rect x="39.8" y="158.4" width="130.8" height="52" rx="10" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="39.8" y="166.4" width="4" height="36" rx="2" fill="#C26A05"/>
<rect x="205.9" y="158.4" width="138.6" height="52" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="205.9" y="166.4" width="4" height="36" rx="2" fill="#64748B"/>
<rect x="382.2" y="158.4" width="130" height="52" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="382.2" y="166.4" width="4" height="36" rx="2" fill="#15803D"/>
<rect x="35.2" y="234.4" width="310" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<rect x="35.2" y="330.4" width="310" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="35.2" y="646.5" width="310" height="43" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="35.2" y="742.5" width="310" height="43" rx="10" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1"/>
<text x="108.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#8A3C0B">SpiDevice</text>
<text x="278.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#334155">spi_master</text>
<text x="450.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#14532D">Device</text>
<text x="49.2" y="261.2" font-size="15" fill="#1E429F">the driver calls Transfer(tx, rx)</text>
<rect x="143.2" y="291.4" width="106.1" height="22" rx="11" fill="#FFFFFF"/>
<text x="196.3" y="307.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">take bus lock</text>
<text x="49.2" y="357.2" font-size="15" fill="#8A3C0B">with DMA: tx into the DMA buffer</text>
<rect x="140.9" y="373.4" width="98.6" height="22" rx="11" fill="#FFFFFF"/>
<text x="190.2" y="389.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">polling_start</text>
<rect x="283.2" y="417.4" width="156" height="22" rx="11" fill="#FFFFFF"/>
<text x="361.2" y="433.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">CS low, SCLK, MOSI</text>
<rect x="314.2" y="461.4" width="94" height="22" rx="11" fill="#FFFFFF"/>
<text x="361.2" y="477.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">MISO bytes</text>
<rect x="327.6" y="505.4" width="67.2" height="22" rx="11" fill="#FFFFFF"/>
<text x="361.2" y="521.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">CS high</text>
<rect x="115" y="549.5" width="150.5" height="22" rx="11" fill="#FFFFFF"/>
<text x="190.2" y="565.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">polling_end (W + T)</text>
<rect x="151.8" y="593.5" width="76.9" height="22" rx="11" fill="#FFFFFF"/>
<text x="190.2" y="609.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">esp_err_t</text>
<text x="49.2" y="673.2" font-size="15" fill="#8A3C0B">still running: wait again, then fail</text>
<rect x="143.2" y="703.5" width="59.4" height="22" rx="11" fill="#FFFFFF"/>
<text x="172.9" y="719.5" font-size="14" font-weight="500" text-anchor="middle" fill="#566070">unlock</text>
<text x="49.2" y="769.2" font-size="15" fill="#1E429F">kb::Status back to the driver</text>
</svg>
