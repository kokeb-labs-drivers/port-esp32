<path d="M292.4 574.5 L454.4 574.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M454.4 618.5 L292.4 618.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M292.4 662.5 L454.4 662.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M284.4 706.5 L122.4 706.5" fill="none" stroke="#7C8798" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#i2c-write-read-arrow-rail)"/>
