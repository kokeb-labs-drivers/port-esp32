<svg xmlns="http://www.w3.org/2000/svg" width="563" height="904" viewBox="0 0 563 904" role="img" aria-labelledby="i2c-write-read-title i2c-write-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-write-read-title">One I2C register read</title>
<desc id="i2c-write-read-desc">Sequence of an I2C WriteRead on the ESP32 port, in which the controller takes its lock, ESP-IDF sends the register address and reads the reply after a repeated START, and the controller turns the result into a kb::Status.</desc>
<defs><marker id="i2c-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="562" height="903" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">One I2C register read</text>
<text x="32" y="102.7" font-size="15" fill="#566070">WriteRead through I2cController and ESP-IDF's i2c_master, with a</text>
<text x="32" y="124.5" font-size="15" fill="#566070">repeated START.</text>
<rect x="32" y="140.4" width="499" height="1" fill="#E2E7EE"/>
