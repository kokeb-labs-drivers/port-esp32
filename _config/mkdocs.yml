# Documentation site on the shared MkDocs platform (kokeb-mkdocs-theme from kokeb-labs/ci-tools). From the root:
#   mkdocs serve -f _config/mkdocs.yml               http://127.0.0.1:8000
#   mkdocs build -f _config/mkdocs.yml --strict      what CI runs
#   kokeb-docs check                                  the drift checks CI runs first
site_name: port-esp32
site_description: >-
  kb-core's bus, pin, clock and log contracts implemented over ESP-IDF v5.5 for the ESP32 family.
repo_url: https://github.com/kokeb-labs-drivers/port-esp32
copyright: Copyright (c) 2026 The port-esp32 authors
docs_dir: ../docs
site_dir: ../site

theme:
  name: kokeb

plugins:
  - kokeb
  - search
  - awesome-nav
