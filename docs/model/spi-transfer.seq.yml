kind: seq
id: spi-transfer
title: One SPI frame
kicker: port-esp32
subtitle: Transfer through SpiDevice and ESP-IDF's spi_master in polling mode, chip select held for the frame.
alt: >-
  Sequence of an SPI Transfer on the ESP32 port, in which the device takes the bus lock, ESP-IDF clocks the whole
  frame as one polling transaction with chip select low, and the port waits for its end with a bound sized to the
  frame.
reads: >-
  The driver's Transfer call reaches the SpiDevice, which takes the lock of its SPI host within its timeout; with DMA
  the frame is first copied into the host's own DMA buffer. ESP-IDF's spi_master starts one polling transaction: it
  drives chip select low, clocks every byte to the Device and reads its reply, then raises chip select. The SpiDevice
  waits for the end of the transaction for the frame's wire time plus the timeout, and once more; a transaction that
  never ends marks the host failed. The result returns to the driver as a kb::Status.
profile: phone
print: portrait
