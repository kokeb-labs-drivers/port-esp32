<svg xmlns="http://www.w3.org/2000/svg" width="575" height="720" viewBox="0 0 575 720" role="img" aria-labelledby="can-send-receive-title can-send-receive-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="can-send-receive-title">Sending and receiving a CAN frame</title>
<desc id="can-send-receive-desc">Sequence of a CAN Send and a Receive on the ESP32 port, in which Send returns once the TWAI driver has queued the frame, the controller sends it on the bus by interrupt, and Receive takes a frame another node sent.</desc>
