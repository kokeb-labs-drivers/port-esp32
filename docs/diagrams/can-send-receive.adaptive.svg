<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Sending and receiving a CAN frame</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Send queues the frame in ESP-IDF's TWAI driver; Receive takes</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">one from its receive queue.</text>
