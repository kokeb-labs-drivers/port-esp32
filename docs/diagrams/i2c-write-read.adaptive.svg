<rect x="0.5" y="0.5" width="562" height="903" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">One I2C register read</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">WriteRead through I2cController and ESP-IDF's i2c_master, with a</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">repeated START.</text>
<rect x="32" y="140.4" width="499" height="1" class="fk-f-hair"/>
