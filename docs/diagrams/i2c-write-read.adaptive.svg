<text x="121.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">I2cController</text>
<text x="291.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">i2c_master</text>
<text x="461.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device</text>
<text x="62.4" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls WriteRead</text>
<rect x="156.4" y="291.4" width="76" height="22" rx="11" class="fk-f-canvas"/>
<text x="194.4" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">take lock</text>
<rect x="138.9" y="321.4" width="128.8" height="22" rx="11" class="fk-f-canvas"/>
<text x="203.4" y="337.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">change_address</text>
<text x="62.4" y="401.2" font-size="15" class="fk-f-amber-text">only for a new address, no bus traffic</text>
<rect x="138.5" y="417.4" width="129.7" height="22" rx="11" class="fk-f-canvas"/>
<text x="203.4" y="433.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">transmit_receive</text>
<rect x="299" y="461.4" width="148.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="373.4" y="477.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">START, addr+W, tx</text>
<rect x="351.6" y="505.4" width="43.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="373.4" y="521.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">ACK</text>
<rect x="329.5" y="549.5" width="87.8" height="22" rx="11" class="fk-f-canvas"/>
<text x="373.4" y="565.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">Sr, addr+R</text>
<rect x="338.6" y="593.5" width="69.4" height="22" rx="11" class="fk-f-canvas"/>
<text x="373.4" y="609.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">rx bytes</text>
<rect x="347.3" y="637.5" width="52.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="373.4" y="653.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">STOP</text>
<rect x="164.9" y="681.5" width="76.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="203.4" y="697.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">esp_err_t</text>
<rect x="156.4" y="739.5" width="122.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="217.8" y="755.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">classify by time</text>
<text x="62.4" y="805.2" font-size="15" class="fk-f-amber-text">a line held low runs RecoverBus</text>
<text x="62.4" y="857.2" font-size="15" class="fk-f-blue-text">kb::Status back to the driver</text>
</svg>
