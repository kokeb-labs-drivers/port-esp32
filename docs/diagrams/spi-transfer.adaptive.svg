<text x="108.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">SpiDevice</text>
<text x="278.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">spi_master</text>
<text x="450.2" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device</text>
<text x="49.2" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls Transfer(tx, rx)</text>
<rect x="143.2" y="291.4" width="106.1" height="22" rx="11" class="fk-f-canvas"/>
<text x="196.3" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">take bus lock</text>
<text x="49.2" y="357.2" font-size="15" class="fk-f-amber-text">with DMA: tx into the DMA buffer</text>
<rect x="140.9" y="373.4" width="98.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="190.2" y="389.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">polling_start</text>
<rect x="283.2" y="417.4" width="156" height="22" rx="11" class="fk-f-canvas"/>
<text x="361.2" y="433.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">CS low, SCLK, MOSI</text>
<rect x="314.2" y="461.4" width="94" height="22" rx="11" class="fk-f-canvas"/>
<text x="361.2" y="477.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">MISO bytes</text>
<rect x="327.6" y="505.4" width="67.2" height="22" rx="11" class="fk-f-canvas"/>
<text x="361.2" y="521.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">CS high</text>
<rect x="115" y="549.5" width="150.5" height="22" rx="11" class="fk-f-canvas"/>
<text x="190.2" y="565.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">polling_end (W + T)</text>
<rect x="151.8" y="593.5" width="76.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="190.2" y="609.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">esp_err_t</text>
<text x="49.2" y="673.2" font-size="15" class="fk-f-amber-text">still running: wait again, then fail</text>
<rect x="143.2" y="703.5" width="59.4" height="22" rx="11" class="fk-f-canvas"/>
<text x="172.9" y="719.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">unlock</text>
<text x="49.2" y="769.2" font-size="15" class="fk-f-blue-text">kb::Status back to the driver</text>
</svg>
