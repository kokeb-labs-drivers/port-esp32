<text x="125.4" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#FDE68A">CanController</text>
<text x="298.1" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#E2E8F0">TWAI driver</text>
<text x="468.1" y="189.5" font-size="17" font-weight="700" text-anchor="middle" fill="#BBF7D0">Other node</text>
<text x="66.4" y="261.2" font-size="15" fill="#BFDBFE">the driver calls Send(frame, t)</text>
<rect x="143.2" y="277.4" width="131" height="22" rx="11" fill="#0E131A"/>
<text x="208.8" y="293.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">twai_transmit_v2</text>
<rect x="161.9" y="321.4" width="93.8" height="22" rx="11" fill="#0E131A"/>
<text x="208.8" y="337.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">queued: Ok</text>
<rect x="314" y="365.4" width="132.2" height="22" rx="11" fill="#0E131A"/>
<text x="380.1" y="381.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">frame on the bus</text>
<rect x="343.5" y="409.4" width="73.3" height="22" rx="11" fill="#0E131A"/>
<text x="380.1" y="425.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">ACK slot</text>
<rect x="324.5" y="453.4" width="111.2" height="22" rx="11" fill="#0E131A"/>
<text x="380.1" y="469.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">a frame for us</text>
<text x="66.4" y="533.2" font-size="15" fill="#BFDBFE">the driver calls Receive(frame, t)</text>
<rect x="145.9" y="549.5" width="125.7" height="22" rx="11" fill="#0E131A"/>
<text x="208.8" y="565.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">twai_receive_v2</text>
<rect x="168.6" y="593.5" width="80.3" height="22" rx="11" fill="#0E131A"/>
<text x="208.8" y="609.5" font-size="14" font-weight="500" text-anchor="middle" fill="#9AA6B5">the frame</text>
<text x="66.4" y="673.2" font-size="15" fill="#FDE68A">bus-off: BusError until Recover()</text>
</svg>
