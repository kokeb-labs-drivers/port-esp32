<svg xmlns="http://www.w3.org/2000/svg" width="575" height="720" viewBox="0 0 575 720" role="img" aria-labelledby="can-send-receive-title can-send-receive-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="can-send-receive-title">Sending and receiving a CAN frame</title>
<desc id="can-send-receive-desc">Sequence of a CAN Send and a Receive on the ESP32 port, in which Send returns once the TWAI driver has queued the frame, the controller sends it on the bus by interrupt, and Receive takes a frame another node sent.</desc>
<defs><marker id="can-send-receive-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="574" height="719" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Sending and receiving a CAN frame</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Send queues the frame in ESP-IDF's TWAI driver; Receive takes</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">one from its receive queue.</text>
<rect x="32" y="140.4" width="511" height="1" fill="#252F3C"/>
