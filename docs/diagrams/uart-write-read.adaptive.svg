<defs><marker id="uart-write-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-rail"/></marker></defs>
<rect x="0.5" y="0.5" width="564" height="903" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">PORT-ESP32</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">A UART request and reply</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Write fills the hardware FIFO; Read takes the first byte with a</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">timeout, then what is already buffered.</text>
