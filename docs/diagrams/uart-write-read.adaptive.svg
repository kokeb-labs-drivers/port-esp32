<text x="107.7" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-amber-text">Uart</text>
<text x="293.3" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-slate-text">uart driver</text>
<text x="463.3" y="189.5" font-size="17" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device</text>
<text x="48.7" y="261.2" font-size="15" class="fk-f-blue-text">the driver calls Write(tx)</text>
<rect x="142.7" y="291.4" width="86.8" height="22" rx="11" class="fk-f-canvas"/>
<text x="186.1" y="307.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">writer lock</text>
<rect x="144.1" y="321.4" width="106.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="337.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">uart_tx_chars</text>
<rect x="337.5" y="365.4" width="75.5" height="22" rx="11" class="fk-f-canvas"/>
<text x="375.3" y="381.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">TX bytes</text>
<text x="48.7" y="445.2" font-size="15" class="fk-f-amber-text">FIFO full: refill after 8 characters</text>
<rect x="339.3" y="461.4" width="71.9" height="22" rx="11" class="fk-f-canvas"/>
<text x="375.3" y="477.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">RX reply</text>
<text x="48.7" y="541.2" font-size="15" class="fk-f-blue-text">the driver calls Read(rx, timeout)</text>
<rect x="142.7" y="571.5" width="92" height="22" rx="11" class="fk-f-canvas"/>
<text x="188.7" y="587.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">reader lock</text>
<rect x="117.2" y="601.5" width="160.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="617.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">pending error events</text>
<rect x="121.7" y="645.5" width="151.7" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="661.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">read 1 byte, timeout</text>
<rect x="159.7" y="689.5" width="75.6" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="705.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">first byte</text>
<rect x="112.7" y="733.5" width="169.5" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="749.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">read buffered, no wait</text>
<rect x="164.4" y="777.5" width="66.1" height="22" rx="11" class="fk-f-canvas"/>
<text x="197.5" y="793.5" font-size="14" font-weight="500" text-anchor="middle" class="fk-f-muted">the rest</text>
<text x="48.7" y="857.2" font-size="15" class="fk-f-blue-text">byte count back to the driver</text>
</svg>
