<path d="M122.4 346.4 L284.4 346.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
<path d="M122.4 442.4 L284.4 442.4" fill="none" stroke="#6C7889" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i2c-write-read-arrow-rail)"/>
