<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" width="360" height="388" role="img" aria-labelledby="t-esp32 d-esp32" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><title id="t-esp32">ESP32 devkit: bench wiring</title><desc id="d-esp32">ESP32 devkit wiring for the DMA bench: SPI3 (VSPI) with MOSI GPIO23 jumpered to MISO GPIO19, SCLK GPIO18, CS GPIO5, USB console.</desc><rect width="360" height="388" rx="14" fill="#FFFFFF" stroke="#E2E7EE"/><text x="16" y="34" font-size="11" font-weight="700" fill="#7A360E" text-anchor="start">BENCH WIRING</text><text x="16" y="56" font-size="18" font-weight="700" fill="#0E1726" text-anchor="start">ESP32 devkit</text><text x="16" y="76" font-size="12" font-weight="400" fill="#566070" text-anchor="start">SPI items, T8 receive rounding</text><rect x="16" y="96" width="132" height="244" rx="10" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1.5"/><text x="82" y="118" font-size="12" font-weight="600" fill="#566070" text-anchor="middle">SPI3 (VSPI)</text><rect x="26" y="134" width="112" height="22" rx="6" fill="#EAF2FF" stroke="#BCD2F9"/><text x="34" y="149.5" font-size="12" font-weight="700" fill="#1E429F" text-anchor="start">SCLK</text><text x="132" y="149.5" font-size="12" font-weight="400" fill="#1E429F" text-anchor="end">GPIO18</text><line x1="148" y1="145.0" x2="182" y2="145.0" stroke="#2563EB" stroke-width="2"/><circle cx="148" cy="145.0" r="3" fill="#2563EB"/><text x="188" y="149.5" font-size="12" font-weight="400" fill="#0E1726" text-anchor="start">analyser CH0, optional</text><rect x="26" y="164" width="112" height="22" rx="6" fill="#EAF2FF" stroke="#BCD2F9"/><text x="34" y="179.5" font-size="12" font-weight="700" fill="#1E429F" text-anchor="start">MOSI</text><text x="132" y="179.5" font-size="12" font-weight="400" fill="#1E429F" text-anchor="end">GPIO23</text><line x1="148" y1="175.0" x2="182" y2="175.0" stroke="#2563EB" stroke-width="2"/><circle cx="148" cy="175.0" r="3" fill="#2563EB"/><text x="188" y="179.5" font-size="12" font-weight="400" fill="#0E1726" text-anchor="start">jumper to MISO</text><rect x="26" y="194" width="112" height="22" rx="6" fill="#EAF2FF" stroke="#BCD2F9"/><text x="34" y="209.5" font-size="12" font-weight="700" fill="#1E429F" text-anchor="start">MISO</text><text x="132" y="209.5" font-size="12" font-weight="400" fill="#1E429F" text-anchor="end">GPIO19</text><line x1="148" y1="205.0" x2="182" y2="205.0" stroke="#2563EB" stroke-width="2"/><circle cx="148" cy="205.0" r="3" fill="#2563EB"/><text x="188" y="209.5" font-size="12" font-weight="400" fill="#0E1726" text-anchor="start">jumper from MOSI</text><rect x="26" y="224" width="112" height="22" rx="6" fill="#EAF2FF" stroke="#BCD2F9"/><text x="34" y="239.5" font-size="12" font-weight="700" fill="#1E429F" text-anchor="start">CS</text><text x="132" y="239.5" font-size="12" font-weight="400" fill="#1E429F" text-anchor="end">GPIO5</text><line x1="148" y1="235.0" x2="182" y2="235.0" stroke="#2563EB" stroke-width="2"/><circle cx="148" cy="235.0" r="3" fill="#2563EB"/><text x="188" y="239.5" font-size="12" font-weight="400" fill="#0E1726" text-anchor="start">analyser CH1, optional</text><rect x="26" y="254" width="112" height="22" rx="6" fill="#FFF5E3" stroke="#F1CF93"/><text x="34" y="269.5" font-size="12" font-weight="700" fill="#8A3C0B" text-anchor="start">3V3</text><text x="132" y="269.5" font-size="12" font-weight="400" fill="#8A3C0B" text-anchor="end"></text><line x1="148" y1="265.0" x2="182" y2="265.0" stroke="#C26A05" stroke-width="2"/><circle cx="148" cy="265.0" r="3" fill="#C26A05"/><text x="188" y="269.5" font-size="12" font-weight="400" fill="#0E1726" text-anchor="start">divider top</text><rect x="26" y="284" width="112" height="22" rx="6" fill="#F1F4F8" stroke="#CBD5E1"/><text x="34" y="299.5" font-size="12" font-weight="700" fill="#334155" text-anchor="start">GND</text><text x="132" y="299.5" font-size="12" font-weight="400" fill="#334155" text-anchor="end"></text><line x1="148" y1=