<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 518" width="360" height="518" role="img" aria-labelledby="t-esp32c6 d-esp32c6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><title id="t-esp32c6">ESP32-C6 devkit: bench wiring</title><desc id="d-esp32c6">ESP32-C6 devkit wiring for the DMA bench: SPI2 with MOSI GPIO18 jumpered to MISO GPIO20, SCLK GPIO19, CS GPIO21, three ADC inputs on a resistor divider, USB console.</desc><rect width="360" height="518" rx="14" fill="#0E131A" stroke="#283241"/><text x="16" y="34" font-size="11" font-weight="700" fill="#F8D27A" text-anchor="start">BENCH WIRING</text><text x="16" y="56" font-size="18" font-weight="700" fill="#E8EDF3" text-anchor="start">ESP32-C6 devkit</text><text x="16" y="76" font-size="12" font-weight="400" fill="#9AA6B5" text-anchor="start">SPI and ADC items</text><rect x="16" y="96" width="132" height="334" rx="10" fill="#151C26" stroke="#3A4657" stroke-width="1.5"/><text x="82" y="118" font-size="12" font-weight="600" fill="#9AA6B5" text-anchor="middle">SPI2</text><rect x="26" y="134" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="149.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">SCLK</text><text x="132" y="149.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO19</text><line x1="148" y1="145.0" x2="182" y2="145.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="145.0" r="3" fill="#60A5FA"/><text x="188" y="149.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">analyser CH0, optional</text><rect x="26" y="164" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="179.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">MOSI</text><text x="132" y="179.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO18</text><line x1="148" y1="175.0" x2="182" y2="175.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="175.0" r="3" fill="#60A5FA"/><text x="188" y="179.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">jumper to MISO</text><rect x="26" y="194" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="209.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">MISO</text><text x="132" y="209.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO20</text><line x1="148" y1="205.0" x2="182" y2="205.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="205.0" r="3" fill="#60A5FA"/><text x="188" y="209.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">jumper from MOSI</text><rect x="26" y="224" width="112" height="22" rx="6" fill="#13233A" stroke="#2B4C78"/><text x="34" y="239.5" font-size="12" font-weight="700" fill="#BFDBFE" text-anchor="start">CS</text><text x="132" y="239.5" font-size="12" font-weight="400" fill="#BFDBFE" text-anchor="end">GPIO21</text><line x1="148" y1="235.0" x2="182" y2="235.0" stroke="#60A5FA" stroke-width="2"/><circle cx="148" cy="235.0" r="3" fill="#60A5FA"/><text x="188" y="239.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">analyser CH1, optional</text><rect x="26" y="254" width="112" height="22" rx="6" fill="#11281A" stroke="#285A3A"/><text x="34" y="269.5" font-size="12" font-weight="700" fill="#BBF7D0" text-anchor="start">ADC0</text><text x="132" y="269.5" font-size="12" font-weight="400" fill="#BBF7D0" text-anchor="end">GPIO0</text><line x1="148" y1="265.0" x2="182" y2="265.0" stroke="#4ADE80" stroke-width="2"/><circle cx="148" cy="265.0" r="3" fill="#4ADE80"/><text x="188" y="269.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">tap 1, 0.8 V</text><rect x="26" y="284" width="112" height="22" rx="6" fill="#11281A" stroke="#285A3A"/><text x="34" y="299.5" font-size="12" font-weight="700" fill="#BBF7D0" text-anchor="start">ADC1</text><text x="132" y="299.5" font-size="12" font-weight="400" fill="#BBF7D0" text-anchor="end">GPIO1</text><line x1="148" y1="295.0" x2="182" y2="295.0" stroke="#4ADE80" stroke-width="2"/><circle cx="148" cy="295.0" r="3" fill="#4ADE80"/><text x="188" y="299.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">tap 2, 1.65 V</text><rect x="26" y="314" width="112" height="22" rx="6" fill="#11281A" stroke="#285A3A"/><text x="34" y="329.5" font-size="12" font-weight="700" fill="#BBF7D0" text-anchor="start">ADC2</text><text x="132" y="329.5" font-size="12" font-weight="400" fill="#BBF7D0" text-anchor="end">GPIO4</text><line x1="148" y1="325.0" x2="182" y2="325.0" stroke="#4ADE80" stroke-width="2"/><circle cx="148" cy="325.0" r="3" fill="#4ADE80"/><text x="188" y="329.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">tap 3, 2.5 V</text><rect x="26" y="344" width="112" height="22" rx="6" fill="#2C2310" stroke="#6A5220"/><text x="34" y="359.5" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="start">3V3</text><text x="132" y="359.5" font-size="12" font-weight="400" fill="#FDE68A" text-anchor="end"></text><line x1="148" y1="355.0" x2="182" y2="355.0" stroke="#FBBF24" stroke-width="2"/><circle cx="148" cy="355.0" r="3" fill="#FBBF24"/><text x="188" y="359.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">divider top</text><rect x="26" y="374" width="112" height="22" rx="6" fill="#1B232E" stroke="#3A4656"/><text x="34" y="389.5" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="start">GND</text><text x="132" y="389.5" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="end"></text><line x1="148" y1="385.0" x2="182" y2="385.0" stroke="#94A3B8" stroke-width="2"/><circle cx="148" cy="385.0" r="3" fill="#94A3B8"/><text x="188" y="389.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">divider bottom</text><rect x="26" y="404" width="112" height="22" rx="6" fill="#1B232E" stroke="#3A4656"/><text x="34" y="419.5" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="start">USB</text><text x="132" y="419.5" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="end"></text><line x1="148" y1="415.0" x2="182" y2="415.0" stroke="#94A3B8" stroke-width="2"/><circle cx="148" cy="415.0" r="3" fill="#94A3B8"/><text x="188" y="419.5" font-size="12" font-weight="400" fill="#E8EDF3" text-anchor="start">console 115200 Bd</text><path d="M182 175.0 C 172 179.0, 172 201.0, 182 205.0" fill="none" stroke="#F4B942" stroke-width="3"/><text x="16" y="462" font-size="12" font-weight="400" fill="#9AA6B5" text-anchor="start">Divider: four 10 kOhm in series, 3V3 to GND;</text><text x="16" y="478" font-size="12" font-weight="400" fill="#9AA6B5" text-anchor="start">the inner nodes are taps 1 to 3.</text><text x="16" y="502" font-size="12" font-weight="400" fill="#9AA6B5" text-anchor="start">Jumper under 10 cm for 8 MHz SCLK.</text></svg>
